<html>
    <head>
        <link rel="stylesheet" href="../styles/clinicalPrint.css" media="print" />
        <style>
body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .certificate-container {
            border: 2px solid #333;
            padding: 20px 40px;
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            text-align: left;
        }

        .certificate-header {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
        }

        .certificate-body {
            font-size: 1.8em;
            text-align: left;
            margin-bottom: 20px;
        }

        .certificate-footer {
            font-size: 1.5em;
            margin-top: 30px;
            text-align: right;
        }

        .certificate-label {
            font-weight: bold;
            margin-right: 10px;
        }

        .certificate-section {
            margin-bottom: 15px;
        }

        .certificate-statement {
            font-size: 1.5em;
            font-style: italic;
            margin-top: 40px;
            text-align: center;
        }

        .prescribe-report-logo {
            max-width: 100px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        </style>
    </head>

    <body>
        <div ng-controller="printDeliveryCertificateController">
            <delivery-certificate is-delivery-certificate="isDeliveryCertificate" certificate-data="certificateData"></delivery-certificate>
        </div>
    </body>
</html>
